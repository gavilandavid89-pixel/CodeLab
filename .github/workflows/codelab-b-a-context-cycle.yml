name: CodeLab B-A Context Cycle (real ADMIN export)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-real-ab:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '[Run B-A Context Cycle]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the real A/B export workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run ".github/workflows/codelab-ab-animation.yml" --repo "$GITHUB_REPOSITORY"
          gh issue comment 492 --repo "$GITHUB_REPOSITORY" --body "[CodeLab B-A Context Cycle] Dispatched the real ADMIN → A → Video Composer → B verification workflow. No demo animation path is used."
