name: Headless PixelForge Runtime

on:
  push:
    branches: ["feat/headless-pixelforge-runtime", "feat/headless-pixelforge-multilayer-integration", "integration/**"]
  pull_request:
    branches: ["main", "feat/codelab-pixelforge-studio-entry-clean", "feat/headless-pixelforge-multilayer-integration"]
    paths:
      - "public/pixelforge/src/**"
      - "tests/pixelforge-headless-runtime.test.mjs"
      - "tests/pixelforge-headless-bridge.test.mjs"
      - "tests/pixelforge-agent-bridge-contract.test.mjs"
      - ".github/scripts/codelab-bridge.mjs"
      - ".github/workflows/headless-pixelforge-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate runtime module syntax
        run: |
          node --check .github/scripts/codelab-bridge.mjs
          node --experimental-default-type=module --check public/pixelforge/src/headless.js
          node --experimental-default-type=module --check public/pixelforge/src/animation.js
          node --experimental-default-type=module --check public/pixelforge/src/ai-tools.js
          node --experimental-default-type=module --check public/pixelforge/src/workspaces.js
          node --experimental-default-type=module --check public/pixelforge/src/headless-bridge.js
          node --experimental-default-type=module --check public/pixelforge/src/headless-vision.js
      - name: Run agent bridge and canvas coordinate contract tests
        run: node --test tests/pixelforge-agent-bridge-contract.test.mjs
      - name: Run headless runtime, bridge and vision contract tests
        run: node --experimental-default-type=module --test tests/pixelforge-headless-runtime.test.mjs tests/pixelforge-headless-bridge.test.mjs tests/pixelforge-headless-vision.test.mjs
