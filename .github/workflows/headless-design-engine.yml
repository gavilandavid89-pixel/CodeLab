name: Headless Design Engine

on:
  push:
    branches:
      - feat/headless-design-engine-core
  pull_request:
    paths:
      - 'headless/**'
      - 'public/pixelforge/src/**'
      - 'tests/pixelforge-*'
      - '.github/scripts/codelab-bridge.mjs'
      - 'docs/assistant-tool-catalog.md'
      - '.github/workflows/headless-design-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated browser for capture verification
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check headless engine and workspace runtime syntax
        run: |
          node --check headless/design-engine.js
          node --check headless/design-accessibility.js
          node --check headless/workspace-runtime.js
          node --check headless/transfer-store.js
          node --check headless/image-transfer-finalize.js
          node --check headless/code-chunks.js
          node --check headless/pixelforge-command-contract.test.js
          node --check .github/scripts/codelab-bridge.mjs
          node --check server.js
      - name: Run isolated headless engine and workspace runtime tests
        run: node --test headless/pixelforge-command-contract.test.js headless/image-transfer-finalize.test.js headless/transfer-store.test.js headless/code-chunks.test.js headless/design-engine.test.js headless/design-accessibility.test.js headless/design-export-parity.test.js headless/design-templates-responsive.test.js headless/workspace-runtime.test.js headless/integration-contract.test.js
      - name: Test PixelForge Headless project factory
        run: node --experimental-default-type=module --test headless/pixelforge-project-factory.test.mjs
      - name: Test PixelForge portable project import
        run: node --test headless/pixelforge-project-import.test.mjs
      - name: Check headless assistant bridge contracts
        run: node tests/assistant-tools-contract.test.js
      - name: Verify one complete project journey through Chromium
        run: node --test headless/project-journey.e2e.test.js
      - name: Verify real PNG and context revision pairing
        run: node --test headless/design-capture-browser.test.js
      - name: Verify isolated preview form and file interactions
        run: node --test headless/preview-interaction-browser.test.js
      - name: Verify preview upload input validation
        run: node --test headless/preview-upload.test.js
