name: CodeLab Independent A-B Stress Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codelab-ab-stress.yml"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Start one persistent A
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "A_START=$start" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/dispatches" --input - <<JSON
{"event_type":"codelab-session-a","client_payload":{"session_minutes":"360","mailbox_transport":"relay","mailbox_base_url":"https://codelab-pbw9.onrender.com"}}
          JSON
          echo "A requested (persistent B→A rendezvous stress)"

      - name: Resolve A session id without GitHub comment rendezvous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 30); do
            run_id="$(gh run list --repo "$GH_REPO" --workflow "CodeLab Independent Session A" --limit 10 --json databaseId,status,createdAt --jq '.[] | select((.status=="in_progress" or .status=="queued") and .createdAt >= env.A_START) | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          session_id="independent-$run_id"
          echo "A_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "A_SESSION_ID=$session_id" >> "$GITHUB_ENV"
          echo "A_MAILBOX=https://codelab-pbw9.onrender.com" >> "$GITHUB_ENV"
          echo "A session: $session_id"

      - name: Launch 5 independent B concurrently
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "B_CONCURRENT_START=$start" >> "$GITHUB_ENV"
          for n in $(seq 1 5); do
            gh api "repos/$GH_REPO/dispatches" --input - <<JSON
{"event_type":"codelab-session-b","client_payload":{"mode":"concurrent","session_id":"$A_SESSION_ID","mailbox_base_url":"$A_MAILBOX"}}
          JSON
          done
          echo "5 concurrent B requests dispatched"

      - name: Verify 5 concurrent B results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          done=0
          for i in $(seq 1 36); do
            rows="$(gh run list --repo "$GH_REPO" --workflow "CodeLab Independent Session B" --limit 30 --json databaseId,createdAt,status,conclusion --jq '.[] | select(.createdAt >= env.B_CONCURRENT_START) | [.databaseId,.status,.conclusion] | @tsv')"
            done="$(printf '%s
' "$rows" | awk -F '	' '$2=="completed" {n++} END {print n+0}')"
            bad="$(printf '%s
' "$rows" | awk -F '	' '$2=="completed" && $3!="success" {n++} END {print n+0}')"
            echo "concurrent: done=$done bad=$bad"
            if [ "$done" -ge 5 ]; then
              test "$bad" -eq 0
              break
            fi
            sleep 10
          done
          test "$done" -ge 5

      - name: Launch queued batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "B_QUEUE_START=$start" >> "$GITHUB_ENV"
          for n in $(seq 1 5); do
            gh api "repos/$GH_REPO/dispatches" --input - <<JSON
{"event_type":"codelab-session-b","client_payload":{"mode":"queue","session_id":"$A_SESSION_ID","mailbox_base_url":"$A_MAILBOX"}}
          JSON
          done
          echo "5 queued B requests dispatched"

      - name: Verify queued batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          done=0
          for i in $(seq 1 36); do
            rows="$(gh run list --repo "$GH_REPO" --workflow "CodeLab Independent Session B" --limit 40 --json databaseId,createdAt,status,conclusion --jq '.[] | select(.createdAt >= env.B_QUEUE_START) | [.databaseId,.status,.conclusion] | @tsv')"
            done="$(printf '%s
' "$rows" | awk -F '	' '$2=="completed" {n++} END {print n+0}')"
            bad="$(printf '%s
' "$rows" | awk -F '	' '$2=="completed" && $3!="success" {n++} END {print n+0}')"
            echo "queue: done=$done bad=$bad"
            if [ "$done" -ge 5 ]; then
              test "$bad" -eq 0
              break
            fi
            sleep 10
          done
          test "$done" -ge 5

      - name: Normal gated chain B1 -> result -> B2 -> result -> B3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            gh api "repos/$GH_REPO/dispatches" --input - <<JSON
{"event_type":"codelab-session-b","client_payload":{"mode":"normal","session_id":"$A_SESSION_ID","mailbox_base_url":"$A_MAILBOX"}}
          JSON
            local before="$BEFORE"
            for i in $(seq 1 36); do
              row="$(gh run list --repo "$GH_REPO" --workflow "CodeLab Independent Session B" --limit 50 --json databaseId,createdAt,status,conclusion --jq '.[] | select(.createdAt >= env.BEFORE) | [.databaseId,.status,.conclusion] | @tsv' | head -n 1)"
              if [ -n "$row" ]; then
                status="$(printf '%s' "$row" | cut -f2)"
                conclusion="$(printf '%s' "$row" | cut -f3)"
                echo "normal: run=$(printf '%s' "$row" | cut -f1) status=$status conclusion=$conclusion"
                if [ "$status" = "completed" ]; then
                  test "$conclusion" = "success"
                  return 0
                fi
              fi
              sleep 10
            done
            return 1
          }
          for n in $(seq 1 3); do
            BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export BEFORE
            dispatch_and_wait
            echo "Normal gated step $n succeeded; next B is now allowed."
          done

      - name: Final assertion
        run: echo "A-B stress matrix passed: concurrent=5, queue=5, gated=3"
