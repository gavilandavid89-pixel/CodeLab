name: PixelForge Validation

on:
  push:
    paths:
      - 'public/pixelforge/**'
      - 'tests/pixelforge-*.test.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'public/pixelforge/**'
      - 'tests/pixelforge-*.test.mjs'
      - 'package.json'

jobs:
  pixelforge-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run PixelForge validation
        run: npm run test:pixelforge
