name: PixelForge animation core

on:
  push:
    branches: ["feat/pixelforge-animation-core", "feat/pixelforge-hq-capacity"]
    paths:
      - "public/pixelforge/src/animation.mjs"
      - "tests/pixelforge-animation.test.mjs"
      - ".github/workflows/pixelforge-animation-core.yml"
      - "server.js"
      - "server.js"
  pull_request:
    branches: ["fix/pixelforge-mobile-files-panel", "feat/pixelforge-animation-core"]
    paths:
      - "public/pixelforge/src/animation.mjs"
      - "tests/pixelforge-animation.test.mjs"
      - ".github/workflows/pixelforge-animation-core.yml"
      - "server.js"

permissions:
  contents: read

jobs:
  animation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate animation module syntax
        run: node --check public/pixelforge/src/animation.mjs
      - name: Test frame timeline model
        run: node --test tests/pixelforge-animation.test.mjs
      - name: Guard original editor feature parity
        run: node --test tests/pixelforge-feature-parity.test.mjs
