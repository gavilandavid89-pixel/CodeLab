name: PixelForge animation core

on:
  push:
    branches: ["feat/pixelforge-animation-core", "feat/pixelforge-hq-capacity", "feat/pixelforge-source-quality-motion-export", "integration/**"]
    paths:
      - "public/pixelforge/src/animation.mjs"
      - "public/pixelforge/src/animation-tiles.mjs"
      - "public/pixelforge/src/raster-tiled-adapter.mjs"
      - "public/pixelforge/src/raster-tiled-brush.mjs"
      - "tests/pixelforge-raster-tiled-brush.test.mjs"
      - "tests/pixelforge-raster-tiled-adapter.test.mjs"
      - "public/pixelforge/src/animation-tiled-adapter.mjs"
      - "public/pixelforge/src/drawing-mode-config.mjs"
      - "public/pixelforge/src/editor.js"
      - "public/pixelforge/src/headless.js"
      - "tests/pixelforge-headless-runtime.test.mjs"
      - "public/pixelforge/index.html"
      - "public/pixelforge/styles.css"
      - "tests/pixelforge-drawing-mode-config.test.mjs"
      - "tests/pixelforge-codelab-package.test.mjs"
      - "pixelforge-codelab-package.mjs"
      - "codelab-project-package-installer.mjs"
      - "codelab-project-structured-format.mjs"
      - "tests/pixelforge-animation-tiled-adapter.test.mjs"
      - "tests/pixelforge-animation.test.mjs"
      - "tests/pixelforge-zip-export.test.mjs"
      - "public/pixelforge/src/zip-export.js"
      - "public/pixelforge/src/editor.js"
      - "public/pixelforge/src/showcase-animation.mjs"
      - "public/pixelforge/src/video-composer-core.mjs"
      - "public/pixelforge/video-composer.html"
      - "public/pixelforge/video-composer.css"
      - "public/pixelforge/video-composer.js"
      - "tests/pixelforge-video-composer.e2e.test.mjs"
      - "tests/pixelforge-video-composer-core.test.mjs"
      - "tests/pixelforge-showcase-animation.test.mjs"
      - "public/pixelforge/index.html"
      - ".github/workflows/pixelforge-animation-core.yml"
      - "server.js"
      - "public/pixelforge/src/core.js"
      - "public/pixelforge/src/persistence.js"
      - "pixelforge-upload-store.js"
      - "tests/pixelforge-integration.test.js"
  pull_request:
    branches: ["main", "fix/pixelforge-mobile-files-panel", "feat/pixelforge-animation-core"]
    paths:
      - "public/pixelforge/src/raster-tiled-brush.mjs"
      - "tests/pixelforge-raster-tiled-brush.test.mjs"
      - "public/pixelforge/src/raster-tiled-adapter.mjs"
      - "tests/pixelforge-raster-tiled-adapter.test.mjs"
      - "public/pixelforge/src/animation-tiles.mjs"
      - "public/pixelforge/src/editor.js"
      - ".github/workflows/pixelforge-animation-core.yml"

permissions:
  contents: read

jobs:
  animation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Validate animation and persistence module syntax
        run: |
          node --check public/pixelforge/src/animation.mjs
          node --check public/pixelforge/src/animation-tiles.mjs
          node --check public/pixelforge/src/raster-tiled-adapter.mjs
          node --check public/pixelforge/src/raster-tiled-brush.mjs
          node --check public/pixelforge/src/animation-tiled-adapter.mjs
          node --check public/pixelforge/src/drawing-mode-config.mjs
          node --check public/pixelforge/src/editor.js
          node --experimental-default-type=module --check public/pixelforge/src/zip-export.js
          node --input-type=module --check < public/pixelforge/src/editor.js
          node --input-type=module --check < public/pixelforge/src/persistence.js
          node --check pixelforge-upload-store.js
          node --check server.js
          node --check tests/pixelforge-integration.test.js
      - name: Test frame timeline model
        run: node --test tests/pixelforge-animation.test.mjs
      - name: Test tile-backed animation migration adapter
        run: node --experimental-default-type=module --test tests/pixelforge-animation-tiled-adapter.test.mjs
      - name: Test tile-backed raster project migration adapter
        run: node --experimental-default-type=module --test tests/pixelforge-raster-tiled-adapter.test.mjs
      - name: Test sparse tiled brush and eraser parity
        run: node --experimental-default-type=module --test tests/pixelforge-raster-tiled-brush.test.mjs
      - name: Test persisted drawing mode configuration
        run: node --experimental-default-type=module --test tests/pixelforge-drawing-mode-config.test.mjs
      - name: Test Headless drawing mode preservation
        run: node --experimental-default-type=module --test tests/pixelforge-headless-runtime.test.mjs
      - name: Test drawing mode preservation in CodeLab ZIP packages
        run: node --experimental-default-type=module --test tests/pixelforge-codelab-package.test.mjs
      - name: Test ZIP archive export
        run: node --experimental-default-type=module --test tests/pixelforge-zip-export.test.mjs
      - name: Test 24-frame soldier reference-guided walk-to-crouch showcase animation
        run: node --experimental-default-type=module --test tests/pixelforge-showcase-animation.test.mjs
      - name: Test Video Composer ZIP package reader
        run: node --experimental-default-type=module --test tests/pixelforge-video-composer-core.test.mjs
      - name: Guard original editor feature parity
        run: node --test tests/pixelforge-feature-parity.test.mjs
