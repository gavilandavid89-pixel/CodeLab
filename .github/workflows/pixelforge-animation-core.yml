name: PixelForge animation core

on:
  push:
    branches: ["feat/pixelforge-animation-core", "feat/pixelforge-hq-capacity"]
    paths:
      - "public/pixelforge/src/animation.mjs"
      - "tests/pixelforge-animation.test.mjs"
      - "tests/pixelforge-zip-export.test.mjs"
      - "public/pixelforge/src/zip-export.js"
      - "public/pixelforge/src/editor.js"
      - "public/pixelforge/src/showcase-animation.mjs"
      - "tests/pixelforge-showcase-animation.test.mjs"
      - "public/pixelforge/src/showcase-animation.mjs"
      - "tests/pixelforge-showcase-animation.test.mjs"
      - "public/pixelforge/index.html"
      - ".github/workflows/pixelforge-animation-core.yml"
      - "server.js"
      - "public/pixelforge/src/core.js"
      - "public/pixelforge/src/persistence.js"
      - "pixelforge-upload-store.js"
      - "tests/pixelforge-integration.test.js"
  pull_request:
    branches: ["fix/pixelforge-mobile-files-panel", "feat/pixelforge-animation-core"]
    paths:
      - "public/pixelforge/src/animation.mjs"
      - "tests/pixelforge-animation.test.mjs"
      - "tests/pixelforge-zip-export.test.mjs"
      - "public/pixelforge/src/zip-export.js"
      - "public/pixelforge/src/editor.js"
      - "public/pixelforge/index.html"
      - ".github/workflows/pixelforge-animation-core.yml"
      - "public/pixelforge/src/core.js"

permissions:
  contents: read

jobs:
  animation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate animation and persistence module syntax
        run: |
          node --check public/pixelforge/src/animation.mjs
          node --experimental-default-type=module --check public/pixelforge/src/zip-export.js
          node --input-type=module --check < public/pixelforge/src/editor.js
          node --input-type=module --check < public/pixelforge/src/persistence.js
          node --check pixelforge-upload-store.js
          node --check server.js
          node --check tests/pixelforge-integration.test.js
      - name: Test frame timeline model
        run: node --test tests/pixelforge-animation.test.mjs
      - name: Test ZIP archive export
        run: node --experimental-default-type=module --test tests/pixelforge-zip-export.test.mjs
      - name: Test 12-frame showcase animation
        run: node --experimental-default-type=module --test tests/pixelforge-showcase-animation.test.mjs
      - name: Guard original editor feature parity
        run: node --test tests/pixelforge-feature-parity.test.mjs
