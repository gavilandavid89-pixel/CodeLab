name: Inline bridge smoke test

on:
  push:
    paths:
      - .github/workflows/inline-bridge-smoke-test.yml
      - server.js

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Manifest
        id: manifest
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_TOKEN" || { echo "Missing CODELAB_AGENT_BRIDGE_CONTROL_SECRET GitHub secret"; exit 1; }
          # Actual SHA-256 of the one-byte payload "x".
          SHA=$(printf x | sha256sum | awk '{print $1}')
          BODY=$(printf '{"total_bytes":1,"total_chunks":1,"sha256":"%s","filename":"inline-self-test.codelab","target_workspace_id":"ws_local_admin","project_name":"inline-self-test","self_test":true}' "$SHA")
          curl --fail-with-body -sS -X POST "https://codelab-qedi.onrender.com/api/agent/bridge/artifacts"             -H "x-codelab-agent-bridge-token: $BRIDGE_TOKEN" -H 'content-type: application/json' --data "$BODY" | tee manifest.json
          test "$(jq -r '.ok' manifest.json)" = "true"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Chunk
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifactId' manifest.json)
          curl --fail-with-body -sS -X PUT "https://codelab-qedi.onrender.com/api/agent/bridge/artifacts/$ID/0"             -H "x-codelab-agent-bridge-token: $BRIDGE_TOKEN" -H 'content-type: application/octet-stream' --data-binary 'x' | tee chunk.json
          test "$(jq -r '.ok' chunk.json)" = "true"
      - name: Commit
        shell: bash
        env:
          BRIDGE_TOKEN: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifactId' manifest.json)
          SHA=$(printf x | sha256sum | awk '{print $1}')
          curl --fail-with-body -sS -X POST "https://codelab-qedi.onrender.com/api/agent/bridge/artifacts/$ID/commit"             -H "x-codelab-agent-bridge-token: $BRIDGE_TOKEN" -H 'content-type: application/json' --data "{\"sha256\":\"$SHA\"}" | tee commit.json
          test "$(jq -r '.ok' commit.json)" = "true"
          test "$(jq -r '.status' commit.json)" = "verified"
          cat commit.json
