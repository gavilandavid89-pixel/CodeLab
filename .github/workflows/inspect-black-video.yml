name: Inspect black PixelForge video

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17
      - run: npm install --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Download evidence video and extract frames
        env:
          TARGET_URL: https://codelab-pbw9.onrender.com
          ADMIN_USERNAME: ${{ secrets.CODELAB_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
          EVENT_ID: 933b85df-9126-4bd9-bb8c-19532f0ec8c2
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs/promises');
          const cp = require('child_process');
          const { promisify } = require('util');
          const exec = promisify(cp.execFile);
          const target = process.env.TARGET_URL.replace(/\/$/,'');
          const browser = await chromium.launch({headless:true});
          const request = await browser.request.newContext();
          const login = await request.post(target + '/api/auth/login', {
            headers:{'content-type':'application/json'},
            data:{username:process.env.ADMIN_USERNAME,password:process.env.ADMIN_PASSWORD}
          });
          if (!login.ok()) throw new Error('login HTTP '+login.status());
          const res = await request.get(target + '/api/pixelforge/evidence/' + process.env.EVENT_ID + '/video');
          if (!res.ok()) throw new Error('video HTTP '+res.status());
          await fs.writeFile('/tmp/video.webm', await res.body());
          console.log('downloaded', (await fs.stat('/tmp/video.webm')).size, 'bytes');
          await exec('ffmpeg',['-y','-i','/tmp/video.webm','-vf','select=eq(n\\,0)+eq(n\\,60)+eq(n\\,119)','-vsync','0','/tmp/frame-%02d.png']);
          await exec('ffmpeg',['-y','-i','/tmp/video.webm','-vf','blackdetect=d=0.1:pix_th=0.10','-an','-f','null','-'],{maxBuffer:1024*1024*8});
          await browser.close();
          NODE
      - name: Upload visual inspection frames
        uses: actions/upload-artifact@v4
        with:
          name: black-video-inspection
          path: |
            /tmp/video.webm
            /tmp/frame-*.png
          retention-days: 1
