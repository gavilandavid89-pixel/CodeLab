name: Inspect PixelForge evidence video

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Existing PixelForge evidence event ID that has a video"
        required: true
        type: string

# Auto-trigger marker: this branch is intentionally push-triggered for inspection.

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17
      - run: npm install --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download evidence video and extract frames
        env:
          TARGET_URL: https://codelab-qedi.onrender.com
          ADMIN_USERNAME: ADMIN
          ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
          EVENT_ID: ${{ github.event.inputs.event_id }}
        run: |
          node <<'NODE'
          import { chromium, request } from 'playwright';
          import { writeFile, stat } from 'node:fs/promises';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const target = process.env.TARGET_URL.replace(/\/$/,'');
          const browser = await chromium.launch({headless:true});
          const api = await request.newContext();
          const login = await api.post(target + '/api/auth/login', {
            headers:{'content-type':'application/json'},
            data:{username:process.env.ADMIN_USERNAME,password:process.env.ADMIN_PASSWORD}
          });
          if (!login.ok()) throw new Error('login HTTP '+login.status());
          const res = await api.get(target + '/api/pixelforge/evidence/' + process.env.EVENT_ID + '/video');
          if (!res.ok()) throw new Error('video HTTP '+res.status());
          await writeFile('/tmp/video.webm', await res.body());
          console.log('downloaded', (await stat('/tmp/video.webm')).size, 'bytes');
          await exec('ffmpeg',['-y','-i','/tmp/video.webm','-vf','select=eq(n\\,0)+eq(n\\,60)+eq(n\\,119)','-vsync','0','/tmp/frame-%02d.png']);
          await exec('ffmpeg',['-y','-i','/tmp/video.webm','-vf','blackdetect=d=0.1:pix_th=0.10','-an','-f','null','-'],{maxBuffer:1024*1024*8});
          await browser.close();
          NODE
      - name: Upload visual inspection frames
        uses: actions/upload-artifact@v4
        with:
          name: black-video-inspection
          path: |
            /tmp/video.webm
            /tmp/frame-*.png
          retention-days: 1
