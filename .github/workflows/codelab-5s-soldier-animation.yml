name: CodeLab 5s soldier animation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/codelab-5s-soldier-animation.yml"
      - "tests/pixelforge-visual-evidence.e2e.test.js"
      - "public/pixelforge/**"
      - "server.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soldier-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Preflight PixelForge module syntax
        run: |
          node --check public/pixelforge/src/editor.js
          node --check public/pixelforge/src/showcase-animation.mjs
          node --check public/pixelforge/src/animation.mjs
          node --check public/pixelforge/src/core.js
      - name: Capture 5-second reference-guided animation
        env:
          HEADLESS_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/codelab-5s-animation
        run: node tests/pixelforge-visual-evidence.e2e.test.js
      - name: Validate WebM recording and full 5s playback evidence
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/codelab-5s-animation
        run: |
          test -s "$ARTIFACT_DIR/polished-animation.webm"
          python - <<'PY'
          import os, subprocess, json
          p=os.path.join(os.environ["ARTIFACT_DIR"],"polished-animation.webm")
          out=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",p],text=True)
          d=float(json.loads(out)["format"]["duration"])
          print(f"duration={d:.3f}s")
          # Playwright records from page creation, so the WebM also contains the
          # editor boot/navigation time. The test explicitly waits at least 5.35s
          # after playback starts; allow a shorter startup segment while retaining
          # the 5s playback evidence check performed by the E2E test.
          if not (8.0 <= d <= 14.0):
              raise SystemExit(f"unexpected recording duration: {d}")
          PY
      - name: Upload 5-second animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-5s-soldier-animation
          path: ${{ runner.temp }}/codelab-5s-animation
          if-no-files-found: error
          retention-days: 14

# Policy gate: every new run must be visually inspected before acceptance.
