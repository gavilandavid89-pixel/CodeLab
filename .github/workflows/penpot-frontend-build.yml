name: Build Penpot frontend from vendored source

on:
  push:
    branches:
      - feat/penpot-source-integration
    paths:
      - .github/workflows/penpot-frontend-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penpot-frontend-build
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout CodeLab with vendored Penpot
        uses: actions/checkout@v4
        with:
          ref: feat/penpot-source-integration

      - name: Verify immutable Penpot source pin
        run: |
          set -euo pipefail
          test -s docs/penpot-integration/PINNED-UPSTREAM.md
          grep -q 'f66e5afa70e7d5e039b79cee758bf8e03510ad3e' docs/penpot-integration/PINNED-UPSTREAM.md
          test -s vendor/penpot/LICENSE
          test -s vendor/penpot/frontend/scripts/build
          test -s vendor/penpot/render-wasm/_build_env
          test -s vendor/penpot/docker/devenv/Dockerfile

      - name: Build the pinned upstream toolchain image
        run: |
          docker build --pull -t codelab-penpot-devenv:2.19.0 vendor/penpot/docker/devenv

      - name: Compile Penpot frontend, workers, plugins and WASM
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE/vendor/penpot,target=/home/penpot/penpot" \
            --workdir /home/penpot/penpot/frontend \
            codelab-penpot-devenv:2.19.0 \
            sudo -EH -u penpot ./scripts/build 2.19.0

      - name: Verify compiled editor and renderer artifacts
        run: |
          set -euo pipefail
          test -s vendor/penpot/frontend/target/dist/index.html
          test -d vendor/penpot/frontend/target/dist/js
          test -s vendor/penpot/frontend/resources/public/js/render.js
          test -s vendor/penpot/frontend/resources/public/js/render.wasm
          test -s vendor/penpot/frontend/resources/public/js/libs.js
          echo "Penpot frontend bundle compiled successfully."

      - name: Upload compiled Penpot frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: codelab-penpot-2.19.0-frontend
          path: vendor/penpot/frontend/target/dist/
          if-no-files-found: error
          retention-days: 14
