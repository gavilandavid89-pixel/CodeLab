name: Build Penpot frontend from vendored source

on:
  push:
    branches:
      - feat/penpot-source-integration
    paths:
      - .github/workflows/penpot-frontend-build.yml
      - vendor/penpot/frontend/src/app/main/repo.cljs
      - vendor/penpot/frontend/src/app/main/data/persistence.cljs
      - vendor/penpot/common/src/app/common/transit.cljc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penpot-frontend-build
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout CodeLab with vendored Penpot
        uses: actions/checkout@v4
        with:
          ref: feat/penpot-source-integration

      - name: Verify immutable Penpot source pin
        run: |
          set -euo pipefail
          test -s docs/penpot-integration/PINNED-UPSTREAM.md
          grep -q 'f66e5afa70e7d5e039b79cee758bf8e03510ad3e' docs/penpot-integration/PINNED-UPSTREAM.md
          test -s vendor/penpot/LICENSE
          test -s vendor/penpot/frontend/scripts/build
          test -s vendor/penpot/render-wasm/_build_env
          test -s vendor/penpot/docker/devenv/Dockerfile

      - name: Pull the upstream Penpot build environment
        run: |
          set -euo pipefail
          docker pull penpotapp/devenv:latest
          docker image inspect --format '{{index .RepoDigests 0}}' penpotapp/devenv:latest | tee penpot-build-image-digest.txt

      - name: Verify upstream build toolchain versions
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash penpotapp/devenv:latest -lc '
            node --version | grep -F "v24.22.2"
            pnpm --version | grep -F "12.16.1"
            java -version 2>&1 | grep -F "27.0.0"
            rustc --version | grep -F "1.91.0"
            source /opt/emsdk/emsdk_env.sh
            emcc --version | grep -F "4.0.6"
          '

      - name: Compile Penpot shared JVM classes
        run: |
          set -euo pipefail
          docker run --rm -e EXTERNAL_UID="$(id -u)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/vendor/penpot,target=/home/penpot/penpot" \
            --workdir /home/penpot/penpot/common \
            penpotapp/devenv:latest \
            sudo -EH -u penpot clojure -T:build compile

      - name: Compile Penpot frontend, workers, plugins and WASM
        run: |
          set -euo pipefail
          docker run --rm -e EXTERNAL_UID="$(id -u)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/vendor/penpot,target=/home/penpot/penpot" \
            --workdir /home/penpot/penpot/frontend \
            penpotapp/devenv:latest \
            sudo -EH -u penpot ./scripts/build 2.19.0

      - name: Verify compiled editor and renderer artifacts
        run: |
          set -euo pipefail
          test -s vendor/penpot/frontend/target/dist/index.html
          test -d vendor/penpot/frontend/target/dist/js
          test -s vendor/penpot/frontend/resources/public/js/render-wasm.js
          test -s vendor/penpot/frontend/resources/public/js/render-wasm.wasm
          test -s vendor/penpot/frontend/resources/public/js/worker/render.js
          test -s vendor/penpot/frontend/resources/public/js/libs.js
          echo "Penpot frontend bundle compiled successfully."

      - name: Upload compiled Penpot frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: codelab-penpot-2.19.0-frontend
          path: vendor/penpot/frontend/target/dist/
          if-no-files-found: error
          retention-days: 14


      - name: Assemble offline headless worker
        run: |
          set -euo pipefail
          rm -rf headless-penpot-package
          mkdir -p headless-penpot-package/penpot
          cp -R headless-penpot headless-penpot-package/
          cp -R vendor/penpot/frontend/target/dist headless-penpot-package/penpot/dist
          cat > headless-penpot-package/package.json <<'EOF'
          {
            "name": "codelab-headless-penpot-runtime",
            "private": true,
            "type": "module",
            "dependencies": {
              "@sparticuz/chromium": "153.0.0",
              "playwright-core": "1.64.1"
            }
          }
          EOF
          npm install --prefix headless-penpot-package --omit=dev --ignore-scripts
          cp -R headless-penpot-package/node_modules headless-penpot-package/headless-penpot/node_modules
          rm -rf headless-penpot-package/penpot/dist/js/*.map
          tar -C headless-penpot-package -czf codelab-penpot-headless-2.19.0.tar.gz .
          sha256sum codelab-penpot-headless-2.19.0.tar.gz > codelab-penpot-headless-2.19.0.tar.gz.sha256

      - name: Upload offline headless Penpot package
        uses: actions/upload-artifact@v4
        with:
          name: codelab-penpot-headless-2.19.0
          path: |
            codelab-penpot-headless-2.19.0.tar.gz
            codelab-penpot-headless-2.19.0.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
