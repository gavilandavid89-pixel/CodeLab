name: Validate CodeLab

on:
  push:
    branches: ["main", "fix/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/capture.js
          node --check public/design-tools.js
          node --check public/component-library.js
      - name: Test AI-ready design capture export
        run: node tests/design-capture.test.js
      - name: Test design system tokens and contrast
        run: node tests/design-tools.test.js
      - name: Test reusable component library
        run: node tests/component-library.test.js
      - name: Browser test AI-ready web capture
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node tests/capture-browser.test.js
          node tests/design-tools-browser.test.js
          node tests/component-library-browser.test.js
      - name: End-to-end visual design workflow in the real app
        shell: bash
        run: |
          export PORT=3188
          export CODELAB_E2E_BASE_URL="http://127.0.0.1:3188"
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-e2e-data"
          export CODELAB_WORKSPACE_SECRET="test-only-e2e-secret"
          node server.js > "$RUNNER_TEMP/codelab-e2e.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab E2E server log ====="; cat "$RUNNER_TEMP/codelab-e2e.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null
          node tests/design-workflow.e2e.test.js
      - name: Smoke test API and Groq model normalization
        shell: bash
        run: |
          export PORT=3187
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-data"
          export CODELAB_WORKSPACE_SECRET="test-only-secret-for-ci"
          export AI_BASE_URL="https://api.groq.com/openai/v1"
          export AI_MODEL="openai/gpt-oss-120b"
          node server.js > "$RUNNER_TEMP/codelab.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab server log ====="; cat "$RUNNER_TEMP/codelab.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3187/api/health > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/health.json"
          node -e "const h=require(process.env.RUNNER_TEMP + '/health.json'); if (!h.ok) process.exit(1); if (h.ai.model !== 'openai/gpt-oss-120b') { console.error('Unexpected AI model:', h.ai.model); process.exit(1); } console.log('Health OK; Groq model ID preserved:', h.ai.model);"
