name: Validate CodeLab

on:
  workflow_dispatch:
  push:
    branches: ["main", "fix/**", "feature/**", "feat/**", "integration/**"]
  pull_request:
    branches: ["main", "feat/codelab-pixelforge-studio-entry-clean"]

# Keep the newest run for each event/branch while preserving separate push and PR checks.
concurrency:
  group: codelab-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install runtime dependencies for server tests
        run: npm install --no-save --package-lock=false
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check pixelforge-upload-store.js
          node --check public/app.js
          node --check public/capture.js
          node --check public/design-tools.js
          node --check public/design-flow.js
          node --check public/component-library.js
          node --check .github/scripts/codelab-bridge.mjs
          node --experimental-default-type=module --check public/pixelforge/src/headless-vision.js
          node --experimental-default-type=module --check public/pixelforge/src/zip-export.js
          node --check public/pixelforge/src/showcase-animation.mjs
          node --check public/pixelforge/src/video-composer-core.mjs
          node --check public/pixelforge/src/video-capture-layout.mjs
          node --input-type=module --check < public/pixelforge/video-composer.js
          node --check tests/pixelforge-video-composer.e2e.test.mjs
          node --input-type=module --check < public/pixelforge/src/editor.js
          node --experimental-default-type=module --check public/pixelforge/src/scene-workspaces.js
          node --check tests/pixelforge-headless-vision.test.mjs
          node --check tests/assistant-tools-contract.test.js
          node --check tests/server-resilience.test.js
          node --check tests/version-consistency.test.js
          node --check tests/ai-settings-isolation.test.js
          node --check tests/interface-wiring.test.js
          node --check tests/account-isolation.e2e.test.js
          node --check tests/design-tools-usage.e2e.test.js
          node --check tests/interface-responsive.e2e.test.js
          node --check tests/web-editor-ui.e2e.test.js
          node --check tests/continuous-ui-stress.e2e.test.js
          node --check tests/pixelforge-integration.test.js
      - name: Test event-driven Neon bridge contract
        run: node --test tests/agent-bridge-event-driven.test.mjs
      - name: Test PixelForge animation model and UI–Headless contract
        run: node --test tests/pixelforge-animation.test.mjs
      - name: Test PixelForge ZIP export package
        run: node --experimental-default-type=module --test tests/pixelforge-zip-export.test.mjs
      - name: Test independent PixelForge scene workspaces
        run: node --experimental-default-type=module --test tests/pixelforge-scene-workspaces.test.mjs
      - name: Test CodeLab package installation and strict import validation
        run: |
          node --check codelab-project-artifact-import.mjs
          node --check codelab-project-package-installer.mjs
          node --check codelab-project-structured-format.mjs
          node --check pixelforge-codelab-package.mjs
          node --check public/pixelforge/src/codelab-package.js
          node --test tests/codelab-artifact-filename.test.mjs tests/codelab-project-package-installer.test.mjs tests/codelab-structured-project-v2.test.mjs tests/codelab-project-workspace-publish.test.mjs tests/pixelforge-codelab-package.test.mjs tests/pixelforge-codelab-package-browser.test.mjs
      - name: Test PixelForge showcase animation
        run: node --experimental-default-type=module --test tests/pixelforge-showcase-animation.test.mjs
      - name: Test Video Composer ZIP package reader
        run: node --experimental-default-type=module --test tests/pixelforge-video-composer-core.test.mjs
      - name: Test PixelForge Headless runtime, authenticated bridge and vision
        run: node --experimental-default-type=module --test tests/pixelforge-headless-runtime.test.mjs tests/pixelforge-headless-bridge.test.mjs tests/pixelforge-headless-vision.test.mjs tests/pixelforge-reference-center.test.mjs
      - name: Check assistant project lifecycle tool contracts
        run: node tests/assistant-tools-contract.test.js
      - name: Check version metadata consistency
        run: node tests/version-consistency.test.js
      - name: Audit static UI event wiring and IDs
        run: node tests/interface-wiring.test.js
      - name: Check per-account AI settings isolation
        run: node tests/ai-settings-isolation.test.js
      - name: Test server resilience and workspace persistence
        run: node tests/server-resilience.test.js
      - name: Test AI-ready design capture export
        run: node tests/design-capture.test.js
      - name: Test design system tokens and contrast
        run: node tests/design-tools.test.js
      - name: Test reusable component library
        run: node tests/component-library.test.js
      - name: Browser test AI-ready web capture
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node tests/capture-browser.test.js
          node tests/design-tools-browser.test.js
          node tests/component-library-browser.test.js
          node --experimental-default-type=module tests/pixelforge-video-composer.e2e.test.mjs
      - name: Chained full-system E2E in the real app
        shell: bash
        run: |
          export PORT=3188
          export CODELAB_E2E_BASE_URL="http://127.0.0.1:3188"
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-e2e-data"
          export CODELAB_WORKSPACE_SECRET="test-only-e2e-secret"
          # This E2E runs without external PostgreSQL but still exercises isolated
          # authenticated CodeLab accounts against file-backed test persistence.
          # Guest mode would bypass the anonymous-access 401 checks below.
          unset PIXELFORGE_GUEST_MODE
          # Force this explicitly file-backed E2E to ignore any runner-level hosted/DB environment.
          unset DATABASE_URL NODE_ENV RENDER RENDER_SERVICE_ID
          node server.js > "$RUNNER_TEMP/codelab-e2e.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab E2E server log ====="; cat "$RUNNER_TEMP/codelab-e2e.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null
          node tests/pixelforge-integration.test.js
          export HEADLESS_VISUAL_ARTIFACT_DIR="$RUNNER_TEMP/codelab-visual-evidence"
          node tests/design-workflow.e2e.test.js
          node tests/pixelforge-visual-evidence.e2e.test.js
          node tests/design-tools-usage.e2e.test.js
          node tests/interface-responsive.e2e.test.js
          node tests/web-editor-ui.e2e.test.js
          node tests/continuous-ui-stress.e2e.test.js
      - name: Upload deep visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-deep-visual-evidence
          path: ${{ runner.temp }}/codelab-visual-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Test offline save and reconnect recovery
        shell: bash
        run: |
          export PORT=3189
          export CODELAB_E2E_BASE_URL="http://127.0.0.1:3189"
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-offline-e2e-data"
          export CODELAB_WORKSPACE_SECRET="test-only-offline-e2e-secret"
          export PIXELFORGE_GUEST_MODE=true
          node server.js > "$RUNNER_TEMP/codelab-offline-e2e.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab offline E2E server log ====="; cat "$RUNNER_TEMP/codelab-offline-e2e.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null
          node tests/offline-sync.e2e.test.js
      - name: Test concurrent account isolation
        shell: bash
        run: |
          export PORT=3190
          export CODELAB_E2E_BASE_URL="http://127.0.0.1:3190"
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-account-isolation-data"
          export CODELAB_WORKSPACE_SECRET="test-only-account-isolation-secret"
          export PIXELFORGE_GUEST_MODE=true
          node server.js > "$RUNNER_TEMP/codelab-account-isolation.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab account isolation server log ====="; cat "$RUNNER_TEMP/codelab-account-isolation.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null
          node tests/account-isolation.e2e.test.js
      - name: Smoke test API and Groq model normalization
        shell: bash
        run: |
          export PORT=3187
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-data"
          export CODELAB_WORKSPACE_SECRET="test-only-secret-for-ci"
          export AI_BASE_URL="https://api.groq.com/openai/v1"
          export AI_MODEL="openai/gpt-oss-120b"
          node server.js > "$RUNNER_TEMP/codelab.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== CodeLab server log ====="; cat "$RUNNER_TEMP/codelab.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3187/api/health > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/health.json"
          node -e "const h=require(process.env.RUNNER_TEMP + '/health.json'); if (!h.ok) process.exit(1); if (h.ai.model !== 'openai/gpt-oss-120b') { console.error('Unexpected AI model:', h.ai.model); process.exit(1); } console.log('Health OK; Groq model ID preserved:', h.ai.model);"

  pixelforge-postgresql:
    name: PixelForge PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codelab_test
          POSTGRES_USER: codelab
          POSTGRES_PASSWORD: codelab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codelab -d codelab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install runtime and browser test dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Package the isolated Agent Headless runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agent-headless"
          mkdir -p "$RUNNER_TEMP/agent-headless/pixelforge/src"
          cp -R public/pixelforge/src/. "$RUNNER_TEMP/agent-headless/pixelforge/src/"
          cp package.json "$RUNNER_TEMP/agent-headless/"
          if [ -f package-lock.json ]; then cp package-lock.json "$RUNNER_TEMP/agent-headless/"; fi
          printf '%s\\n' \
            "repository=$GITHUB_REPOSITORY" \
            "commit=$GITHUB_SHA" \
            "ref=$GITHUB_REF_NAME" \
            "headless_source=public/pixelforge/src" \
            "packaged_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$RUNNER_TEMP/agent-headless/MANIFEST.txt"
          tar -C "$RUNNER_TEMP/agent-headless" -czf "$RUNNER_TEMP/agent-headless-$GITHUB_SHA.tar.gz" .
      - name: Publish the Headless artifact for the agent-import test
        uses: actions/upload-artifact@v4
        with:
          name: agent-headless-${{ github.sha }}
          path: ${{ runner.temp }}/agent-headless-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Download the published Headless artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-headless-${{ github.sha }}
          path: ${{ runner.temp }}/agent-headless-download
      - name: Extract downloaded Headless artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-headless-extracted"
          tar -xzf "$RUNNER_TEMP/agent-headless-download/agent-headless-$GITHUB_SHA.tar.gz" -C "$RUNNER_TEMP/agent-headless-extracted"
          test -f "$RUNNER_TEMP/agent-headless-extracted/pixelforge/src/headless.js"
          echo "AGENT_HEADLESS_PACKAGE_DIR=$RUNNER_TEMP/agent-headless-extracted/pixelforge/src" >> "$GITHUB_ENV"
      - name: Run PixelForge integration against real PostgreSQL
        shell: bash
        run: |
          export PORT=3191
          export DATABASE_URL="postgres://codelab:codelab_test@127.0.0.1:5432/codelab_test"
          export CODELAB_DATABASE_SSL=disable
          export CODELAB_AGENT_BRIDGE_ENABLED=0
          export CODELAB_AGENT_BRIDGE_CONTROL_SECRET="test-only-agent-bridge-secret"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/2026-11-15-codelab-core-postgres.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/2026-11-24-codelab-project-import-storage.sql
          export CODELAB_E2E_BASE_URL="http://127.0.0.1:3191"
          export CODELAB_DATA_DIR="$RUNNER_TEMP/codelab-pixelforge-postgres-data"
          export CODELAB_WORKSPACE_SECRET="test-only-pixelforge-postgres-secret"
          node server.js > "$RUNNER_TEMP/codelab-pixelforge-postgres.log" 2>&1 &
          SERVER_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== PixelForge PostgreSQL E2E server log ====="; cat "$RUNNER_TEMP/codelab-pixelforge-postgres.log" 2>/dev/null || true; fi; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "$CODELAB_E2E_BASE_URL/api/health" > "$RUNNER_TEMP/codelab-pixelforge-postgres-health.json"
          node -e "const h=require(process.env.RUNNER_TEMP + '/codelab-pixelforge-postgres-health.json'); if (h.persistence !== 'postgresql') { console.error('Expected PostgreSQL persistence, got:', h.persistence); process.exit(1); }"
          node tests/pixelforge-integration.test.js
