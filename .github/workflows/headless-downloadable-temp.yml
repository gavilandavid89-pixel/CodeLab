name: Temporary Headless Downloadable Build

on:
  push:
    branches:
      - temp/headless-downloadable-20261122

permissions:
  contents: read

concurrency:
  group: temporary-headless-downloadable
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged CodeLab source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Playwright FFmpeg
        run: npx playwright-core install ffmpeg
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - name: Run native Headless contracts and visual runtime tests
        run: npm run test:native-headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          HEADLESS_VISUAL_ARTIFACT_DIR: artifacts/native-headless-visuals
      - name: Run PixelForge integration and vector studio tests
        run: npm run test:pixelforge
      - name: Package current CodeLab source for download
        if: success()
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=CodeLab-Headless/ HEAD -o artifacts/CodeLab-Headless-source.zip
          cat > artifacts/HEADLESS-INSTALL.txt <<'EOF'
          CodeLab Headless - source snapshot
          Source commit: ${GITHUB_SHA}
          Runtime: Node.js 22.17.0+
          
          This is an isolated source package. It does not include production credentials,
          Neon data, user projects, Render configuration secrets, or authenticated sessions.
          
          Install:
            npm install --ignore-scripts
            npx playwright-core install ffmpeg
          
          Runtime configuration:
            DATABASE_URL=<your isolated PostgreSQL connection>
            CODELAB_BASE_URL=<your CodeLab server URL>
          
          The assistant headless client uses the configured database and CodeLab API.
          Use an isolated database/workspace for local testing. Do not point it at
          production unless explicitly intended and authorized.
          EOF
      - name: Upload downloadable Headless source package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-Headless-downloadable
          path: |
            artifacts/CodeLab-Headless-source.zip
            artifacts/HEADLESS-INSTALL.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Headless visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-Headless-visual-evidence
          path: artifacts/native-headless-visuals
          if-no-files-found: warn
          retention-days: 14
