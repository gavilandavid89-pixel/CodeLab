name: CodeLab QA and command mailbox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: codelab-bridge-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  code-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check agent-bridge-worker.mjs
          node --check .github/scripts/codelab-bridge.mjs
      - name: Run bridge authorization and mailbox regression tests
        run: node --test tests/codelab-bridge-admin-auth.test.mjs tests/codelab-native-browser-capture.test.mjs

  execute-command:
    if: |
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[CodeLab Bridge]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[CodeLab Bridge]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted bridge implementation
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate ADMIN-only bridge contract
        run: |
          node --check .github/scripts/codelab-bridge.mjs
          node --test tests/codelab-bridge-admin-auth.test.mjs
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.1-chromium-v1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Execute allowlisted CodeLab mailbox command
        env:
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          COMMAND_SOURCE: ${{ github.event_name == 'issue_comment' && 'comment' || 'issue' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_URL: https://codelab-pbw9.onrender.com/
          CODELAB_ADMIN_USERNAME: ${{ secrets.CODELAB_ADMIN_USERNAME }}
          CODELAB_ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
        run: node .github/scripts/codelab-bridge.mjs
      - name: Upload readable UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-ui-evidence-${{ github.run_id }}
          path: .codelab-artifacts/bridge-ui.png
          if-no-files-found: ignore
          retention-days: 1
