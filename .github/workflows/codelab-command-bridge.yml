name: CodeLab GitHub command bridge

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: codelab-bridge-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-command:
    if: |
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[CodeLab Bridge]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[CodeLab Bridge]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted bridge implementation
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Execute allowlisted browser command
        env:
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          COMMAND_SOURCE: ${{ github.event_name == 'issue_comment' && 'comment' || 'issue' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_URL: https://codelab-pbw9.onrender.com/
          CODELAB_ADMIN_USERNAME: ${{ secrets.CODELAB_ADMIN_USERNAME }}
          CODELAB_ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
        run: node .github/scripts/codelab-bridge.mjs
      - name: Upload redacted UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-ui-evidence-${{ github.run_id }}
          path: .codelab-artifacts/bridge-ui.png
          if-no-files-found: ignore
          retention-days: 1
