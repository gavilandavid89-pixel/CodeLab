name: CodeLab Video Composer Machine

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long the processing machine stays available"
        required: false
        default: "30"

permissions:
  contents: read
  issues: write

jobs:
  video-composer-machine:
    name: Dedicated Video Composer machine
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_URL: https://codelab-pbw9.onrender.com
      CODELAB_ADMIN_USERNAME: ${{ secrets.CODELAB_ADMIN_USERNAME }}
      CODELAB_ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
      WORKER_KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes || '30' }}
    steps:
      - name: Checkout CodeLab
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start Video Composer machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codelab-video-composer-machine.mjs
