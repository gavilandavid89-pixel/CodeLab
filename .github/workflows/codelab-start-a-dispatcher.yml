name: CodeLab start supervised A

on:
  push:
    branches: [main]
    paths:
      - '.codelab/dispatch/start-a/**'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-a:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent A with the mandatory 10-minute window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run .github/workflows/codelab-independent-session-a.yml --repo "$GH_REPO" --ref main -f session_minutes=10
          echo "Dispatched supervised CodeLab Session A for 10 minutes."
