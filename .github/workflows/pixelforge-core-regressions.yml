name: PixelForge Raster Core Regressions

on:
  push:
    branches: ["feature/pixelforge-core-tool-regressions"]
  pull_request:
    branches: ["feat/codelab-pixelforge-studio-entry-clean"]

jobs:
  raster-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run PixelForge raster core regression suite
        run: node tests/pixelforge-core-tools.test.js
