name: Penpot host adapter tests

on:
  push:
    branches:
      - feat/penpot-source-integration
    paths:
      - "public/penpot-host.js"
      - "server.js"
      - "penpot-transit.js"
      - "penpot-identity.js"
      - "penpot-websocket.js"
      - "penpot-rpc-contract.js"
      - "tests/penpot-host.test.js"
      - "tests/penpot-transit.test.js"
      - "tests/penpot-identity.test.js"
      - "tests/penpot-websocket.test.js"
      - "tests/penpot-rpc-contract.test.js"
      - "package.json"
      - ".github/workflows/penpot-host-tests.yml"
  pull_request:
    paths:
      - "public/penpot-host.js"
      - "server.js"
      - "penpot-transit.js"
      - "penpot-identity.js"
      - "penpot-websocket.js"
      - "penpot-rpc-contract.js"
      - "tests/penpot-host.test.js"
      - "tests/penpot-transit.test.js"
      - "tests/penpot-identity.test.js"
      - "tests/penpot-websocket.test.js"
      - "tests/penpot-rpc-contract.test.js"
      - "package.json"
      - ".github/workflows/penpot-host-tests.yml"

permissions:
  contents: read

jobs:
  penpot-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Transit dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check CodeLab server syntax
        run: node --check server.js
      - name: Run Penpot host and Transit codec tests
        run: npm run test:penpot
