name: CodeLab Independent Session A

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue used as the A/B rendezvous mailbox'
        required: false
        default: '492'
        type: string
      session_id:
        description: 'Optional stable A session identifier'
        required: false
        default: ''
        type: string
      minutes:
        description: 'How long A remains alive, independent of B'
        required: false
        default: '360'
        type: string
      project_id:
        description: 'ADMIN PixelForge project to pin for this session'
        required: false
        default: '6f9cdb50-55a3-4d78-bd34-9cc95b54a5be'
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  session-a:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '[Start Independent A]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install A browser runtime
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Validate trusted A runtime
        run: |
          node --check scripts/codelab-ab-session-host.mjs
          node --check pixelforge-video-composer-export.mjs
          node --test tests/codelab-ab-session-contract.test.mjs
      - name: Keep ADMIN-backed CodeLab and Video Composer session alive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODELAB_SESSION_ISSUE: ${{ inputs.issue_number || '492' }}
          CODELAB_SESSION_ID: ${{ inputs.session_id || '' }}
          CODELAB_SESSION_MINUTES: ${{ inputs.minutes || '360' }}
          CODELAB_PROJECT_ID: ${{ inputs.project_id || '6f9cdb50-55a3-4d78-bd34-9cc95b54a5be' }}
          CODELAB_PUBLIC_URL: https://codelab-qedi.onrender.com
          CODELAB_AGENT_BRIDGE_CONTROL_SECRET: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
        run: node scripts/codelab-ab-session-host.mjs 2>&1 | tee codelab-session-a.log
      - name: Upload A session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-session-a-log-${{ github.run_id }}
          path: codelab-session-a.log
          if-no-files-found: ignore
          retention-days: 1
