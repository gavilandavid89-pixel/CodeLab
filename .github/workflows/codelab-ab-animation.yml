name: CodeLab A/B real ADMIN Soldier Walk export

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'How long A remains alive after B finishes'
        required: false
        default: '30'
        type: string
      project_id:
        description: 'Persisted ADMIN PixelForge project'
        required: false
        default: 'soldier-walk-60f-20261124'
        type: string

concurrency:
  group: codelab-video-processor
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  request-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install B Chromium decoder runtime
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Check A/B session contract tests
        run: node --test tests/codelab-ab-session-contract.test.mjs
      - name: Start independent A workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SESSION_MINUTES: ${{ inputs.session_minutes || '30' }}
          PROJECT_ID: ${{ inputs.project_id || 'soldier-walk-60f-20261124' }}
        run: |
          set -euo pipefail
          session_id="ab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CODELAB_SESSION_ID=$session_id" >> "$GITHUB_ENV"
          echo "CODELAB_A_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run ".github/workflows/codelab-independent-session-a.yml" \
            --repo "$GITHUB_REPOSITORY" \
            -f issue_number=492 \
            -f session_id="$session_id" \
            -f minutes="$SESSION_MINUTES" \
            -f project_id="$PROJECT_ID"
          echo "Dispatched A session $session_id"
      - name: Wait for A READY and confirm its workflow is live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/issues/492/comments?per_page=100&since=$CODELAB_A_STARTED_AT" | jq -r --arg expected "$CODELAB_SESSION_ID" '[.[] | select(.body | startswith("[CodeLab A Ready]\n")) | {created_at, payload: (.body | split("\n")[1] | fromjson)} | select(.payload.sessionId == $expected)] | last | [.payload.sessionId, (.payload.runId|tostring), .created_at] | @tsv' 2>/dev/null || true)"
            session_id="$(printf '%s' "$candidate" | cut -f1)"
            run_id="$(printf '%s' "$candidate" | cut -f2)"
            ready_since="$(printf '%s' "$candidate" | cut -f3)"
            if [ "$session_id" = "$CODELAB_SESSION_ID" ] && [ -n "$run_id" ] && [ -n "$ready_since" ]; then
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>/dev/null || true)"
              if [ "$status" = "in_progress" ]; then
                echo "CODELAB_A_RUN_ID=$run_id" >> "$GITHUB_ENV"
                echo "CODELAB_A_READY_SINCE=$ready_since" >> "$GITHUB_ENV"
                echo "A READY: session=$session_id run=$run_id"
                exit 0
              fi
            fi
            echo "Waiting for A READY ($i/120)..."
            sleep 5
          done
          echo "A did not become READY."
          exit 1
      - name: B requests the real Video Composer export and verifies the delivered file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODELAB_SESSION_ISSUE: "492"
          CODELAB_A_READY_SINCE: ${{ env.CODELAB_A_READY_SINCE }}
          CODELAB_SESSION_TIMEOUT_MS: "1200000"
          CODELAB_AB_OUTPUT_DIR: ${{ runner.temp }}/codelab-ab-video
        run: node scripts/codelab-ab-session-request.mjs
      - name: Verify A remains alive after B has finished
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          A_RUN_ID: ${{ env.CODELAB_A_RUN_ID }}
        run: |
          set -euo pipefail
          test -n "$A_RUN_ID"
          status="$(gh run view "$A_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          echo "A status after B: $status"
          test "$status" = "in_progress"
      - name: Upload the video received and verified by B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-soldier-walk-webm-${{ github.run_id }}
          path: ${{ runner.temp }}/codelab-ab-video
          if-no-files-found: warn
          retention-days: 14
