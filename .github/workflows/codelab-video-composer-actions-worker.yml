name: CodeLab Video Composer Actions Worker

on:
  push:
    branches:
      - "test/video-composer-actions-worker"
  workflow_dispatch:
    inputs:
      project_id:
        description: "PixelForge project id"
        required: false
        default: "2b33ccf4-f70c-4649-bed8-df1707cfdc74"
      keepalive_seconds:
        description: "Keep runner alive in the dedicated keepalive job"
        required: false
        default: "1800"

permissions:
  contents: read

jobs:
  video-composer:
    name: Video Composer export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CodeLab
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Run CodeLab Video Composer
        env:
          TARGET_URL: https://codelab-pbw9.onrender.com
          PROJECT_ID: ${{ inputs.project_id || '2b33ccf4-f70c-4649-bed8-df1707cfdc74' }}
          KEEPALIVE_SECONDS: "0"
          CODELAB_ADMIN_USERNAME: ${{ secrets.CODELAB_ADMIN_USERNAME }}
          CODELAB_ADMIN_PASSWORD: ${{ secrets.CODELAB_ADMIN_PASSWORD }}
        run: node .github/scripts/codelab-video-composer-actions-worker.mjs

  runner-keepalive:
    name: Dedicated runner keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Keep dedicated processing slot alive
        env:
          KEEPALIVE_SECONDS: ${{ inputs.keepalive_seconds || '1800' }}
        run: |
          echo "Dedicated keepalive runner started."
          echo "This job intentionally has no Video Composer work."
          echo "Keeping slot alive for ${KEEPALIVE_SECONDS} seconds."
          sleep "${KEEPALIVE_SECONDS}"
          echo "Dedicated keepalive runner finished."
