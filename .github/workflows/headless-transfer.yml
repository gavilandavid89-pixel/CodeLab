name: Headless Transfer Protocol

on:
  pull_request:
    paths:
      - 'headless/transfer-store.js'
      - 'headless/transfer-store.test.js'
      - 'server.js'
      - '.github/workflows/headless-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check transfer and server syntax
        run: |
          node --check headless/transfer-store.js
          node --check server.js
      - name: Test chunk integrity, ownership, replay, expiry-safe storage and image signatures
        run: node --test headless/transfer-store.test.js
