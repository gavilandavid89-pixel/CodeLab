name: CodeLab Independent Session B

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "Stress mode"
        required: false
        default: "normal"
        type: choice
        options: [normal, concurrent, queue, walk, walk-step]
      session_id:
        description: "Existing persistent A session ID (preferred for stress runs)"
        required: false
        default: ""
        type: string
      mailbox_base_url:
        description: "Persistent A mailbox base URL"
        required: false
        default: "https://codelab-pbw9.onrender.com"
        type: string
      walk_frame_index:
        description: "Frame to generate when mode=walk-step"
        required: false
        default: "1"
        type: string
      walk_project_id:
        description: "Existing PixelForge project ID for supervised walk-step"
        required: false
        default: ""
        type: string
      request:
        description: "Structured CodeLab session request JSON"
        required: false
        default: '{"kind":"browser","start_path":"/pixelforge/index.html","actions":[{"type":"wait_for","selector":"body","state":"visible","timeoutMs":30000},{"type":"screenshot","fullPage":false}]}'
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  request:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && startsWith(github.event.comment.body, '[Start Independent B]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover independently running A once
        if: ${{ github.event_name == 'issue_comment' || github.event.inputs.session_id == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 24); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/codelab-independent-session-a.yml" --limit 20 --json databaseId,status,event,createdAt --jq '.[] | select((.status=="in_progress" or .status=="queued") and (.event=="workflow_dispatch" or .event=="issue_comment")) | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          session="independent-$run_id"
          echo "CODELAB_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "CODELAB_MAILBOX_BASE_URL=https://codelab-pbw9.onrender.com" >> "$GITHUB_ENV"
          echo "Connected to active A session: $session"

      - name: Set supplied A session
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.session_id != '' }}
        env:
          SUPPLIED_SESSION_ID: ${{ github.event.inputs.session_id }}
          SUPPLIED_MAILBOX: ${{ github.event.inputs.mailbox_base_url || 'https://codelab-pbw9.onrender.com' }}
        run: |
          echo "CODELAB_SESSION_ID=$SUPPLIED_SESSION_ID" >> "$GITHUB_ENV"
          echo "CODELAB_MAILBOX_BASE_URL=$SUPPLIED_MAILBOX" >> "$GITHUB_ENV"
          echo "Connected directly to supplied A session: $SUPPLIED_SESSION_ID"

      - name: Send independent B request to A
        id: request
        if: ${{ github.event.inputs.mode != 'walk' }}
        env:
          CODELAB_SESSION_TIMEOUT_MS: "120000"
          CODELAB_SESSION_REQUEST: ${{ github.event.inputs.request || '{"kind":"browser","start_path":"/pixelforge/index.html","actions":[{"type":"wait_for","selector":"body","state":"visible","timeoutMs":30000},{"type":"screenshot","fullPage":false}]}' }}
        run: |
          echo "B mode: ${{ github.event.inputs.mode || 'normal' }}"
          node scripts/codelab-session-request.mjs

      - name: Run B→A→context→B→A walking animation cycle
        id: walk
        if: ${{ github.event.inputs.mode == 'walk' || github.event.inputs.mode == 'walk-step' }}
        env:
          CODELAB_SESSION_TIMEOUT_MS: "240000"
          CODELAB_WALK_ONE_STEP: ${{ github.event.inputs.mode == 'walk-step' && '1' || '0' }}
          CODELAB_WALK_FRAME_INDEX: ${{ github.event.inputs.walk_frame_index || '1' }}
          CODELAB_WALK_PROJECT_ID: ${{ github.event.inputs.walk_project_id || '' }}
        run: |
          echo "B mode: ${{ github.event.inputs.mode || 'walk' }} frame=${CODELAB_WALK_FRAME_INDEX} project=${CODELAB_WALK_PROJECT_ID:-new}"
          node scripts/codelab-b-a-context-cycle.mjs 2>&1 | tee walk-result.log
          grep -o '{\"ok\":true.*' walk-result.log | tail -n 1 > walk-result.json || true


      - name: Publish B verification result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="${{ steps.request.outcome || steps.walk.outcome }}"
          summary=""
          if [ -s walk-result.json ]; then
            summary="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("walk-result.json","utf8")); console.log(JSON.stringify({run:process.env.GITHUB_RUN_ID,ok:j.ok,projectId:j.animation?.projectId,frame:j.animation?.requestedFrame,oneStep:j.animation?.oneStep,proof:j.proof?.lastFrameProof,protocol:j.protocol}))' 2>/dev/null || true)"
          fi
          gh issue comment 492 --repo "$GH_REPO" --body "[CodeLab B Result] run=${{ github.run_id }} status=$status session=${CODELAB_SESSION_ID:-unknown} $summary"
