name: CodeLab Independent Session B

on:
  push:
    branches: [main]
    paths:
      - '.codelab/requests/**'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "Stress mode"
        required: false
        default: "normal"
        type: choice
        options: [normal, concurrent, queue, walk, walk-step]
      session_id:
        description: "Existing persistent A session ID (preferred for stress runs)"
        required: false
        default: ""
        type: string
      mailbox_base_url:
        description: "Persistent A mailbox base URL"
        required: false
        default: "https://codelab-pbw9.onrender.com"
        type: string
      walk_frame_index:
        description: "Frame to generate when mode=walk-step"
        required: false
        default: "1"
        type: string
      walk_project_id:
        description: "Existing PixelForge project ID for supervised walk-step"
        required: false
        default: ""
        type: string
      request:
        description: "Structured CodeLab session request JSON"
        required: false
        default: '{"kind":"browser","start_path":"/pixelforge/index.html","actions":[{"type":"wait_for","selector":"body","state":"visible","timeoutMs":30000},{"type":"screenshot","fullPage":false}]}'
        type: string

concurrency:
  group: codelab-independent-session-b
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  request:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && startsWith(github.event.comment.body, '[Start Independent B]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load explicit supervised request
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          request_file="${GITHUB_WORKSPACE}/.codelab/requests/${{ github.event.head_commit.id }}.json"
          if [ ! -f "$request_file" ]; then
            request_file="$(find .codelab/requests -maxdepth 1 -type f -name '*.json' -print | sort | tail -n 1)"
          fi
          test -n "$request_file"
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); for (const [k,v] of Object.entries(j)) { if (v !== undefined && v !== null) console.log(`${k}=${typeof v === "string" ? v : JSON.stringify(v)}`); }' "$request_file" > "$RUNNER_TEMP/codelab-request.env"
          while IFS= read -r line; do echo "$line" >> "$GITHUB_ENV"; done < "$RUNNER_TEMP/codelab-request.env"
          echo "Loaded supervised request: $request_file"

      - name: Discover independently running A once
        if: ${{ github.event_name == 'push' || github.event_name == 'issue_comment' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session_id == '') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${CODELAB_SESSION_ID:-}" ]; then
            echo "Using supplied supervised A session: $CODELAB_SESSION_ID"
            exit 0
          fi
          run_id=""
          for i in $(seq 1 24); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/codelab-independent-session-a.yml" --limit 20 --json databaseId,status,event,createdAt --jq '.[] | select(.status=="in_progress" and (.event=="workflow_dispatch" or .event=="issue_comment" or .event=="push")) | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          session="independent-$run_id"
          echo "CODELAB_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "CODELAB_MAILBOX_BASE_URL=https://codelab-pbw9.onrender.com" >> "$GITHUB_ENV"
          echo "Connected to active A session: $session"

      - name: Set supplied A session
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.session_id != '' }}
        env:
          SUPPLIED_SESSION_ID: ${{ github.event.inputs.session_id }}
          SUPPLIED_MAILBOX: ${{ github.event.inputs.mailbox_base_url || 'https://codelab-pbw9.onrender.com' }}
        run: |
          echo "CODELAB_SESSION_ID=$SUPPLIED_SESSION_ID" >> "$GITHUB_ENV"
          echo "CODELAB_MAILBOX_BASE_URL=$SUPPLIED_MAILBOX" >> "$GITHUB_ENV"
          echo "Connected directly to supplied A session: $SUPPLIED_SESSION_ID"

      - name: Send independent B request to A
        id: request
        if: ${{ github.event_name != 'push' && github.event.inputs.mode != 'walk' && github.event.inputs.mode != 'walk-step' }}
        env:
          CODELAB_SESSION_TIMEOUT_MS: "120000"
          CODELAB_SESSION_REQUEST: ${{ github.event.inputs.request || '{"kind":"browser","start_path":"/pixelforge/index.html","actions":[{"type":"wait_for","selector":"body","state":"visible","timeoutMs":30000},{"type":"screenshot","fullPage":false}]}' }}
        run: |
          echo "B mode: ${{ github.event.inputs.mode || 'normal' }}"
          node scripts/codelab-session-request.mjs

      - name: Run B→A→context→B→A walking animation cycle
        id: walk
        if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'walk' || github.event.inputs.mode == 'walk-step' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '[Start Independent B walk]')) }}
        env:
          CODELAB_SESSION_TIMEOUT_MS: "240000"
        run: |
          if [ -z "${CODELAB_WALK_ONE_STEP:-}" ]; then CODELAB_WALK_ONE_STEP="${{ github.event_name == 'push' && '1' || (github.event.inputs.mode == 'walk-step' && '1' || (github.event_name == 'issue_comment' && '0' || '0')) }}"; export CODELAB_WALK_ONE_STEP; fi
          if [ -z "${CODELAB_WALK_FRAME_INDEX:-}" ]; then CODELAB_WALK_FRAME_INDEX="${{ github.event.inputs.walk_frame_index || '1' }}"; export CODELAB_WALK_FRAME_INDEX; fi
          if [ -z "${CODELAB_WALK_PROJECT_ID:-}" ]; then CODELAB_WALK_PROJECT_ID="${{ github.event.inputs.walk_project_id || '' }}"; export CODELAB_WALK_PROJECT_ID; fi
          echo "B mode: walk frame=${CODELAB_WALK_FRAME_INDEX} project=${CODELAB_WALK_PROJECT_ID:-new}"
          node scripts/codelab-b-a-context-cycle.mjs 2>&1 | tee walk-result.log
          grep -o '{\"ok\":true.*' walk-result.log | tail -n 1 > walk-result.json || true


      - name: Publish B verification result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -s walk-result.json ]; then status="success"; else status="failure"; fi
          summary=""
          if [ -s walk-result.json ]; then
            summary="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("walk-result.json","utf8")); console.log(JSON.stringify({run:process.env.GITHUB_RUN_ID,ok:j.ok,projectId:j.animation?.projectId,frame:j.animation?.requestedFrame,oneStep:j.animation?.oneStep,proof:j.proof?.lastFrameProof,protocol:j.protocol}))' 2>/dev/null || true)"
          fi
          gh issue comment 492 --repo "$GH_REPO" --body "[CodeLab B Result] run=${{ github.run_id }} status=$status session=${CODELAB_SESSION_ID:-unknown} $summary"
