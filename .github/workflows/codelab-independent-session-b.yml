name: CodeLab Independent Session B

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'READY A session ID; leave empty to discover the latest live A'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Maximum time B waits for A and verifies the video'
        required: false
        default: '20'
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  request-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '[Start Independent B]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install Chromium decoder runtime
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Discover a live READY A session
        if: ${{ github.event_name == 'issue_comment' || inputs.session_id == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/492/comments?per_page=100")"
          candidates="$(printf '%s' "$comments" | jq -r 'add | [.[] | select(.body | startswith("[CodeLab A Ready]\n")) | {created_at, payload: (.body | split("\n")[1] | fromjson)}] | sort_by(.created_at) | reverse | .[] | [.payload.sessionId, (.payload.runId|tostring), .created_at] | @tsv')"
          while IFS=$'\t' read -r session_id run_id ready_since; do
            [ -n "$session_id" ] && [ -n "$run_id" ] && [ -n "$ready_since" ] || continue
            status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>/dev/null || true)"
            if [ "$status" = "in_progress" ]; then
              echo "CODELAB_SESSION_ID=$session_id" >> "$GITHUB_ENV"
              echo "CODELAB_A_READY_SINCE=$ready_since" >> "$GITHUB_ENV"
              echo "Discovered live A session $session_id (run $run_id)"
              exit 0
            fi
          done <<< "$candidates"
          echo "No active READY A session found."
          exit 1
      - name: Use supplied A session ID
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.session_id != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPPLIED_SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/492/comments?per_page=100")"
          candidate="$(printf '%s' "$comments" | jq -r --arg expected "$SUPPLIED_SESSION_ID" 'add | [.[] | select(.body | startswith("[CodeLab A Ready]\n")) | {created_at, payload: (.body | split("\n")[1] | fromjson)} | select(.payload.sessionId == $expected)] | sort_by(.created_at) | reverse | first | [.payload.sessionId, (.payload.runId|tostring), .created_at] | @tsv')"
          session_id="$(printf '%s' "$candidate" | cut -f1)"
          run_id="$(printf '%s' "$candidate" | cut -f2)"
          ready_since="$(printf '%s' "$candidate" | cut -f3)"
          [ "$session_id" = "$SUPPLIED_SESSION_ID" ] && [ -n "$run_id" ] && [ -n "$ready_since" ]
          status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          [ "$status" = "in_progress" ]
          echo "CODELAB_SESSION_ID=$session_id" >> "$GITHUB_ENV"
          echo "CODELAB_A_READY_SINCE=$ready_since" >> "$GITHUB_ENV"
      - name: Configure B wait timeout
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '20' }}
        run: |
          set -euo pipefail
          minutes="$TIMEOUT_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || [ "$minutes" -lt 1 ] || [ "$minutes" -gt 30 ]; then
            echo "timeout_minutes must be between 1 and 30"
            exit 1
          fi
          echo "CODELAB_SESSION_TIMEOUT_MS=$((minutes * 60000))" >> "$GITHUB_ENV"
      - name: Request A export and verify delivered WebM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODELAB_SESSION_ISSUE: "492"
          CODELAB_AB_OUTPUT_DIR: ${{ runner.temp }}/codelab-ab-video
        run: node scripts/codelab-ab-session-request.mjs
      - name: Upload the video received and verified by B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-soldier-walk-webm-${{ github.run_id }}
          path: ${{ runner.temp }}/codelab-ab-video
          if-no-files-found: warn
          retention-days: 14
