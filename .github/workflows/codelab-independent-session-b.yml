name: CodeLab Independent Session B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codelab-independent-session-b.yml"
      - "scripts/codelab-session-request.mjs"
      - "scripts/codelab-session-host.mjs"
      - "public/pixelforge/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the independently running A
        id: wait-a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/492/comments?per_page=100")"
            session="$(node -e '
              const a=JSON.parse(process.argv[1]);
              const now=Date.now();
              const candidates=a.filter(c=>{
                const b=String(c.body||"");
                if(!b.startsWith("[CodeLab Session Ready]") || !b.includes("independent-")) return false;
                const m=b.match(/"expiresAt":"([^"]+)"/);
                return m && Date.parse(m[1]) > now;
              }).sort((p,q)=>{ const pm=String(p.body).match(/independent-(\\d+)/); const qm=String(q.body).match(/independent-(\\d+)/); return Number(qm?.[1]||0)-Number(pm?.[1]||0); });
              const x=candidates[0];
              if(x){
                const m=String(x.body).match(/"sessionId":"([^"]+)"/);
                if(m) process.stdout.write(m[1]);
              }
            ' "$comments")"
            if [ -n "$session" ]; then
              echo "CODELAB_SESSION_ID=$session" >> "$GITHUB_ENV"
              echo "Found A session: $session"
              exit 0
            fi
            sleep 2
          done
          echo "A session did not become ready in time." >&2
          exit 1
      - name: Send independent B request to A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODELAB_SESSION_ISSUE: "492"
          CODELAB_SESSION_TIMEOUT_MS: "120000"
          CODELAB_SESSION_REQUEST: '{"kind":"browser","start_path":"/pixelforge/index.html?createDemo=walk-crouch-24&capture=video","actions":[{"type":"wait_for","selector":"#canvas","state":"visible","timeoutMs":30000},{"type":"click","selector":"#animation-play","timeoutMs":30000},{"type":"wait_for","selector":"#animation-frame-count","state":"visible","timeoutMs":10000},{"type":"screenshot","fullPage":false}]}'
        run: node scripts/codelab-session-request.mjs
