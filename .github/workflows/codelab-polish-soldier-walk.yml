name: CodeLab polish ADMIN Soldier Walk

on:
  push:
    paths:
      - 'scripts/codelab-polish-soldier-walk-direct.mjs'
      - 'scripts/codelab-inspect-soldier-walk.mjs'
      - 'scripts/codelab-repair-soldier-walk.mjs'
      - '.github/workflows/codelab-polish-soldier-walk.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect persisted frame structure before any repair'
        required: false
        default: 'inspect'
        type: choice
        options: [inspect, repair, polish]
      project_id:
        description: 'Persisted ADMIN PixelForge project'
        required: false
        default: 'soldier-walk-60f-20261124'
        type: string

permissions:
  contents: read

jobs:
  polish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 492 && github.event.comment.user.login == github.repository_owner && (startsWith(github.event.comment.body, '[Inspect Soldier Walk]') || startsWith(github.event.comment.body, '[Repair Soldier Walk]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install runtime dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Inspect persisted ADMIN animation
        if: ${{ inputs.mode != 'polish' || github.event_name == 'issue_comment' }}
        env:
          CODELAB_PUBLIC_URL: https://codelab-qedi.onrender.com
          CODELAB_PROJECT_ID: ${{ inputs.project_id || 'soldier-walk-60f-20261124' }}
          CODELAB_AGENT_BRIDGE_CONTROL_SECRET: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/codelab-inspect-soldier-walk.mjs
      - name: Upload ADMIN frame inspection
        if: ${{ github.event_name == 'push' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '[Inspect Soldier Walk]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect') }}
        uses: actions/upload-artifact@v4
        with:
          name: codelab-soldier-walk-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/soldier-walk-project.json
            ${{ runner.temp }}/soldier-walk-inspection.json
          retention-days: 3
      - name: Repair persisted ADMIN animation
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'repair') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '[Repair Soldier Walk]')) }}
        env:
          CODELAB_PUBLIC_URL: https://codelab-qedi.onrender.com
          CODELAB_PROJECT_ID: ${{ inputs.project_id || 'soldier-walk-60f-20261124' }}
          CODELAB_AGENT_BRIDGE_CONTROL_SECRET: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/codelab-repair-soldier-walk.mjs
      - name: Upload repair verification
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'repair') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '[Repair Soldier Walk]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: codelab-soldier-walk-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/soldier-walk-repair-verification.json
          retention-days: 14
      - name: Polish persisted ADMIN animation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'polish' }}
        env:
          CODELAB_PUBLIC_URL: https://codelab-qedi.onrender.com
          CODELAB_PROJECT_ID: ${{ inputs.project_id || 'soldier-walk-60f-20261124' }}
          CODELAB_AGENT_BRIDGE_CONTROL_SECRET: ${{ secrets.CODELAB_AGENT_BRIDGE_CONTROL_SECRET }}
          GITHUB_STEP_SUMMARY_FILE: ${{ runner.temp }}/polish-verification.json
        run: node scripts/codelab-polish-soldier-walk-direct.mjs
      - name: Upload polish verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'polish' }}
        uses: actions/upload-artifact@v4
        with:
          name: codelab-soldier-walk-polish-${{ github.run_id }}
          path: ${{ runner.temp }}/polish-verification.json
          retention-days: 14
