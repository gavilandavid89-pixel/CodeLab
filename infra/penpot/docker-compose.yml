# CodeLab hosts Penpot's design/runtime engines privately.
# User accounts, projects, PostgreSQL and persistent files remain CodeLab-owned.
name: codelab
services:
  penpot-frontend:
    image: penpotapp/frontend:${PENPOT_VERSION:-2.19.0}
    restart: unless-stopped
    depends_on: [penpot-backend, penpot-admin-console, penpot-exporter]
    environment:
      PENPOT_FLAGS: disable-registration disable-login-with-password enable-secure-session-cookies
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:3000/penpot/}
      PENPOT_BACKEND_URI: http://penpot-backend:6060
      PENPOT_EXPORTER_URI: http://penpot-exporter:6061
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    expose: ["8080"]
    ports:
      - "127.0.0.1:9001:8080"
    volumes:
    networks: [codelab_internal]

  penpot-backend:
    image: penpotapp/backend:${PENPOT_VERSION:-2.19.0}
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: disable-registration disable-login-with-password enable-secure-session-cookies
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:3000/penpot/}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Set a unique random PENPOT_SECRET_KEY}
      # Existing CodeLab PostgreSQL connection, isolated to a dedicated schema.
      PENPOT_DATABASE_URI: ${PENPOT_DATABASE_URI:?Set PostgreSQL URI for the existing CodeLab database and dedicated Penpot role}
      PENPOT_DATABASE_USERNAME: ${PENPOT_DATABASE_USERNAME:?Set the dedicated restricted Penpot database role}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Set the dedicated Penpot database role password}
      PENPOT_REDIS_URI: redis://penpot-valkey:6379/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets/penpot
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_TELEMETRY_ENABLED: "false"
    expose: ["6060"]
    volumes:
      - ${CODELAB_DATA_DIR:?Mount CodeLab's existing persistent data directory}:/opt/data/assets
    networks: [codelab_internal]

  penpot-admin-console:
    image: penpotapp/admin-console:${PENPOT_VERSION:-2.19.0}
    restart: unless-stopped
    environment:
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:3000/penpot/}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Set a unique random PENPOT_SECRET_KEY}
      PENPOT_DATABASE_URI: ${PENPOT_DATABASE_URI:?Set PostgreSQL URI for the existing CodeLab database and dedicated Penpot role}
      PENPOT_DATABASE_USERNAME: ${PENPOT_DATABASE_USERNAME:?Set the dedicated restricted Penpot database role}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Set the dedicated Penpot database role password}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
    expose: ["3000"]
    networks: [codelab_internal]

  penpot-exporter:
    image: penpotapp/exporter:${PENPOT_VERSION:-2.19.0}
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: enable-secure-session-cookies
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:3000/penpot/}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Set a unique random PENPOT_SECRET_KEY}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey:6379/0
    expose: ["6061"]
    networks: [codelab_internal]

  # Runtime queue/cache engine only; it stores no durable CodeLab user/project data.
  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lfu"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [codelab_internal]

networks:
  codelab_internal:
    internal: true
